name: push YGOPro3

on:
  push:
    tags:
      - 'push.[0-9]+.[0-9]+.[0-9]+'
    
concurrency:
  group: push-ygopro3-bucket
  cancel-in-progress: false
  queue: max

jobs:
  push-to-bucket:
    name: Push all artifacts
    runs-on: self-hosted
    steps:
      - name: Download all artifacts
        uses: robinraju/release-downloader@v1.10
        with:
          tag: release-latest
          fileName: "*"
          out-file-path: "./build/"

      - name: rm artifacts
        run: |
          cd build
          rm YGOPro3-html.zip

      - name: Upload all artifacts to Bucket
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: "/"
          file_path: "./build/*"

  update-version:
    runs-on: ubuntu-latest
    needs: push-to-bucket
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Write Version
        run: |
          cd .ci
          python write_version.py ${{ github.ref_name }}

      - name: Upload to Bucket
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: version.txt
          file_path: ./.ci/version.txt

  flush-cdn:
    runs-on: ubuntu-latest
    needs: update-version
    steps:
      - uses: actions/checkout@v4

      - uses: jwyxym/jwyxym/edgeone-cache@master
        with:
          secret_id: ${{ secrets.EDGE_ID }}
          secret_key: ${{ secrets.EDGE_KEY }}
          zone_id: ${{ secrets.EDGE_ZONE_ID }}
          url_target: ${{ secrets.EDGE_URL }}
          flush_type: "purge_prefix"