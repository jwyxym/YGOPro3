name: push YGOPro3

on:
  push:
    tags:
      - 'push.[0-9]+.[0-9]+.[0-9]+'
    
jobs:
  push-to-bucket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download
        uses: robinraju/release-downloader@v1.10
        with:
          tag: release-latest
          fileName: "*"
          out-file-path: "./build/"

      - name: Rename artifact files
        run: |
          cd build
          sh ../.ci/rename.sh

      - name: Upload artifact to Bucket (YGOPro3-arm64-v8a.apk)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-arm64-v8a.apk
          file_path: ./build/YGOPro3-arm64-v8a.apk

      - name: Upload artifact to Bucket (YGOPro3-armeabi-v7a.apk)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-armeabi-v7a.apk
          file_path: ./build/YGOPro3-armeabi-v7a.apk

      - name: Upload artifact to Bucket (YGOPro3-x86.apk)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-x86.apk
          file_path: ./build/YGOPro3-x86.apk

      - name: Upload artifact to Bucket (YGOPro3-x86_64.apk)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-x86_64.apk
          file_path: ./build/YGOPro3-x86_64.apk

      - name: Upload artifact to Bucket (YGOPro3-windows-x86_64.exe)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-windows-x86_64.exe
          file_path: ./build/YGOPro3-windows-x86_64.exe

      - name: Upload artifact to Bucket (YGOPro3-windows-x86_64.msi)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-windows-x86_64.msi
          file_path: ./build/YGOPro3-windows-x86_64.msi

      - name: Upload artifact to Bucket (YGOPro3-windows-aarch64.exe)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-windows-aarch64.exe
          file_path: ./build/YGOPro3-windows-aarch64.exe

      - name: Upload artifact to Bucket (YGOPro3-windows-aarch64.msi)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-windows-aarch64.msi
          file_path: ./build/YGOPro3-windows-aarch64.msi

      - name: Upload artifact to Bucket (YGOPro3-macos-x86_64.dmg)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-macos-x86_64.dmg
          file_path: ./build/YGOPro3-macos-x86_64.dmg

      - name: Upload artifact to Bucket (YGOPro3-macos-x86_64.app.zip)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-macos-x86_64.app.zip
          file_path: ./build/YGOPro3-macos-x86_64.app.zip

      - name: Upload artifact to Bucket (YGOPro3-macos-aarch64.dmg)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-macos-aarch64.dmg
          file_path: ./build/YGOPro3-macos-aarch64.dmg

      - name: Upload artifact to Bucket (YGOPro3-macos-aarch64.app.zip)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-macos-aarch64.app.zip
          file_path: ./build/YGOPro3-macos-aarch64.app.zip

      - name: Upload artifact to Bucket (YGOPro3-linux-x86_64.deb)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-linux-x86_64.deb
          file_path: ./build/YGOPro3-linux-x86_64.deb

      - name: Upload artifact to Bucket (YGOPro3-linux-aarch64.deb)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-linux-aarch64.deb
          file_path: ./build/YGOPro3-linux-aarch64.deb

      - name: Upload artifact to Bucket (YGOPro3-linux-x86_64.rpm)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-linux-x86_64.rpm
          file_path: ./build/YGOPro3-linux-x86_64.rpm

      - name: Upload artifact to Bucket (YGOPro3-linux-aarch64.rpm)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-linux-aarch64.rpm
          file_path: ./build/YGOPro3-linux-aarch64.rpm

      - name: Upload artifact to Bucket (YGOPro3-linux-x86_64.AppImage)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-linux-x86_64.AppImage
          file_path: ./build/YGOPro3-linux-x86_64.AppImage

      - name: Upload artifact to Bucket (YGOPro3-linux-aarch64.AppImage)
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOPro3-linux-aarch64.AppImage
          file_path: ./build/YGOPro3-linux-aarch64.AppImage

  update-version:
    runs-on: ubuntu-latest
    needs: push-to-bucket
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Write Version
        run: |
          cd .ci
          python write_version.py ${{ github.ref_name }}

      - name: Upload to Bucket
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: version.txt
          file_path: ./.ci/version.txt

  flush-cdn:
    runs-on: ubuntu-latest
    needs: update-version
    steps:
      - uses: actions/checkout@v4

      - uses: jwyxym/jwyxym/edgeone-cache@master
        with:
          secret_id: ${{ secrets.EDGE_ID }}
          secret_key: ${{ secrets.EDGE_KEY }}
          zone_id: ${{ secrets.EDGE_ZONE_ID }}
          url_target: ${{ secrets.EDGE_URL }}
          flush_type: "purge_prefix"