name: build YGOPro3

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    
jobs:
  push-gitcode:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"

      - name: Set SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitcode.com >> ~/.ssh/known_hosts

      - name: Push to GitCode
        run: |
          git remote add gitcode git@gitcode.com:jwyxym/YGOPro3.git
          git fetch gitcode
          git checkout -b gitcode-main gitcode/main
          git merge origin/main
          git push gitcode gitcode-main:main

  prepare-build-tools:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Cache build tool downloads
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/build-tools
        key: build-tool-downloads-${{ hashFiles('package-lock.json', '.ci/prepare-build-tools.cjs') }}

    - name: Download tools for all platforms
      run: node .ci/prepare-build-tools.cjs fetch "${{ runner.temp }}/build-tools"

    - name: Upload Android tools
      uses: actions/upload-artifact@v4
      with:
        name: build-tools-android
        path: ${{ runner.temp }}/build-tools/android/
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    - name: Upload Windows tools
      uses: actions/upload-artifact@v4
      with:
        name: build-tools-windows
        path: ${{ runner.temp }}/build-tools/windows/
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    - name: Upload Linux x86_64 tools
      uses: actions/upload-artifact@v4
      with:
        name: build-tools-linux-x86_64
        path: ${{ runner.temp }}/build-tools/linux-x86_64/
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    - name: Upload Linux aarch64 tools
      uses: actions/upload-artifact@v4
      with:
        name: build-tools-linux-aarch64
        path: ${{ runner.temp }}/build-tools/linux-aarch64/
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  build-android:
    needs: prepare-build-tools
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tauri_target: aarch64
            apk_abi: arm64
            artifact_abi: arm64-v8a
          - tauri_target: armv7
            apk_abi: arm
            artifact_abi: armeabi-v7a
          - tauri_target: i686
            apk_abi: x86
            artifact_abi: x86
          - tauri_target: x86_64
            apk_abi: x86_64
            artifact_abi: x86_64
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: true
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

    - name: Set Android Environment
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> $GITHUB_PATH
        NDK_SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        case "${{ matrix.tauri_target }}" in
          aarch64)
            BINDGEN_TARGET_INCLUDE="aarch64-linux-android"
            ;;
          armv7)
            BINDGEN_TARGET_INCLUDE="arm-linux-androideabi"
            ;;
          i686)
            BINDGEN_TARGET_INCLUDE="i686-linux-android"
            ;;
          x86_64)
            BINDGEN_TARGET_INCLUDE="x86_64-linux-android"
            ;;
        esac
        echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$NDK_SYSROOT -isystem $NDK_SYSROOT/usr/include -isystem $NDK_SYSROOT/usr/include/$BINDGEN_TARGET_INCLUDE" >> $GITHUB_ENV

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Install .NET 10 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Download assets
      uses: robinraju/release-downloader@v1.10
      with:
        tag: assets-latest
        fileName: "assets.zip"
        out-file-path: "./src-tauri/"
        
    - name: Rename assets
      run: mv ./src-tauri/assets.zip ./src-tauri/assets

    - name: Write Tauri Config
      run: |
        npm run json:build android ${{ github.ref_name }}

    - name: NPM Init
      run: |
        npm ci
    
    - name: Android Init
      run: |
        npm run tauri:android:init:sh

    - name: Download prepared Android tools
      uses: actions/download-artifact@v4
      with:
        name: build-tools-android
        path: .build-tools

    - name: Prepare Android build tools
      env:
        BUILD_TOOLS_ARTIFACT: ${{ github.workspace }}/.build-tools
      run: node .ci/prepare-build-tools.cjs android

    - name: Install wget and unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip

    - name: Android build (${{ matrix.artifact_abi }})
      run: |
        npm run copy:sh
        npm run tauri:android:build -- --apk --target ${{ matrix.tauri_target }}

    - name: Git Config
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"

    - name: Set SSH Key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Decode Keystore File
      run: |
        git clone ${{ secrets.KEYSTORE_REPO }} --depth 1 jks
        mv jks/ygopro3.jks ./YGOPro3.jks

    - name: Sign apk (${{ matrix.artifact_abi }})
      run: |
        mkdir build
        apksigner sign --ks ./YGOPro3.jks --ks-key-alias ${{ secrets.KEY_ALIAS }} --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --out ./build/YGOPro3-${{ matrix.artifact_abi }}.apk ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

    - name: Upload (${{ matrix.artifact_abi }})
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro3-${{ matrix.artifact_abi }}.apk
        retention-days: 1
        path: ./build/YGOPro3-${{ matrix.artifact_abi }}.apk

  build-windows:
    needs: prepare-build-tools
    name: build-windows-${{ matrix.target }}
    runs-on: ${{ matrix.run-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            run-on: windows-latest
          - target: aarch64
            run-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Install .NET 10 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Download assets
      uses: robinraju/release-downloader@v1.10
      with:
        tag: assets-latest
        fileName: "assets.zip"
        out-file-path: "./src-tauri/"
        
    - name: Rename assets
      run: move src-tauri\assets.zip src-tauri\assets

    - name: Install wget and unzip
      run: choco install wget unzip -y

    - name: Write Tauri Config
      shell: cmd
      run: |
        npm run json:build windows ${{ github.ref_name }}

    - name: NPM Init
      run: |
        npm ci

    - name: Download prepared Windows tools
      uses: actions/download-artifact@v4
      with:
        name: build-tools-windows
        path: .build-tools

    - name: Prepare Windows build tools
      env:
        BUILD_TOOLS_ARTIFACT: ${{ github.workspace }}/.build-tools
      run: node .ci/prepare-build-tools.cjs windows

    - name: Windows build
      run: |
        npm run tauri:build
    
    - name: Copy
      shell: cmd
      run: |
        set "found_msi="
        set "found_exe="
        mkdir build

        for %%f in (.\src-tauri\target\release\bundle\msi\*) do (
            if not defined found_msi (
                copy "%%f" ".\build\YGOPro3.msi"
                set "found_msi=1"
            )
        )

        for %%f in (.\src-tauri\target\release\bundle\nsis\*) do (
            if not defined found_exe (
                copy "%%f" ".\build\YGOPro3.exe"
                set "found_exe=1"
            )
        )

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro3-windows-${{ matrix.target }}.exe
        retention-days: 1
        path: .\build\YGOPro3.exe

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro3-windows-${{ matrix.target }}.msi
        retention-days: 1
        path: .\build\YGOPro3.msi

  build-macos:
    needs: prepare-build-tools
    name: build-macos-${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
          - target: aarch64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Install .NET 10 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
        target: ${{ matrix.target }}-apple-darwin

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Download assets
      uses: robinraju/release-downloader@v1.10
      with:
        tag: assets-latest
        fileName: "assets.zip"
        out-file-path: "./src-tauri/"
        
    - name: Rename assets
      run: mv ./src-tauri/assets.zip ./src-tauri/assets

    - name: Write Tauri Config
      run: |
        npm run json:build macos ${{ github.ref_name }}

    - name: NPM Init
      run: |
        npm ci

    - name: Prepare macOS build tools
      run: node .ci/prepare-build-tools.cjs macos

    - name: Macos build
      run: |
        npm run tauri:build

    - name: Zip .app
      run: |
        cd ./src-tauri/target/release/bundle/macos/
        zip -r YGOPro3.app.zip ygopro3.app

    - name: Copy
      run: |
        mkdir -p ./build
        DMG_FILES=(./src-tauri/target/release/bundle/dmg/*.dmg)
        cp "${DMG_FILES[0]}" ./build/YGOPro3.dmg

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro3-macos-${{ matrix.target }}.dmg
        retention-days: 1
        path: ./build/YGOPro3.dmg

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro3-macos-${{ matrix.target }}.app.zip
        retention-days: 1
        path: ./src-tauri/target/release/bundle/macos/YGOPro3.app.zip

  build-linux:
    needs: prepare-build-tools
    name: build-linux-${{ matrix.target }}-${{ matrix.bundle }}
    runs-on: ${{ matrix.run-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            run-on: ubuntu-22.04
            bundle: deb
            bundle_dir: deb
            extension: deb
          - target: aarch64
            run-on: ubuntu-24.04-arm
            bundle: deb
            bundle_dir: deb
            extension: deb
          - target: x86_64
            run-on: ubuntu-22.04
            bundle: rpm
            bundle_dir: rpm
            extension: rpm
          - target: aarch64
            run-on: ubuntu-24.04-arm
            bundle: rpm
            bundle_dir: rpm
            extension: rpm
          - target: x86_64
            run-on: ubuntu-22.04
            bundle: appimage
            bundle_dir: appimage
            extension: AppImage
          - target: aarch64
            run-on: ubuntu-24.04-arm
            bundle: appimage
            bundle_dir: appimage
            extension: AppImage
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Install .NET 10 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Download assets
      uses: robinraju/release-downloader@v1.10
      with:
        tag: assets-latest
        fileName: "assets.zip"
        out-file-path: "./src-tauri/"

    - name: Rename assets
      run: mv ./src-tauri/assets.zip ./src-tauri/assets

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          librsvg2-dev \
          libglib2.0-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libatk1.0-dev \
          libgdk-pixbuf2.0-dev \
          build-essential \
          libasound2-dev \
          libssl-dev \
          pkg-config \
          libgtk-3-dev \
          xdg-utils

    - name: Write Tauri Config
      run: |
        npm run json:build linux ${{ github.ref_name }} ${{ matrix.bundle }}

    - name: NPM Init
      run: |
        npm ci

    - name: Download prepared AppImage tools
      if: matrix.bundle == 'appimage'
      uses: actions/download-artifact@v4
      with:
        name: build-tools-linux-${{ matrix.target }}
        path: .build-tools

    - name: Prepare Linux build tools
      env:
        BUILD_TOOLS_ARTIFACT: ${{ github.workspace }}/.build-tools
      run: node .ci/prepare-build-tools.cjs linux ${{ matrix.target }} ${{ matrix.bundle }}

    - name: Build
      run: |
        npm run tauri:build -- --verbose

    - name: Copy
      run: |
        mkdir -p ./build
        cp ./src-tauri/target/release/bundle/${{ matrix.bundle_dir }}/*.${{ matrix.extension }} ./build/YGOPro3.${{ matrix.extension }}

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro3-linux-${{ matrix.target }}.${{ matrix.extension }}
        retention-days: 1
        path: ./build/YGOPro3.${{ matrix.extension }}

  build-html:
    name: build-html
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: NPM Init
      run: |
        npm ci

    - name: HTML build
      run: |
        npm run h5:build -- ${{ github.ref_name }}

    - name: Zip
      run: |
        zip -r YGOPro3-html.zip dist

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: YGOPro3-html.zip
        retention-days: 1
        path: ./YGOPro3-html.zip

  create-release:
    needs: [build-android, build-windows, build-macos, build-linux, build-html]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: YGOPro3-*
          path: build
          merge-multiple: false

      - name: Create release-latest
        run: |
          cd build
          sh ../.ci/rename.sh
          gh release delete release-latest --cleanup-tag -y || true
          gh release create release-latest $(find . -type f) \
            --target "$GITHUB_SHA" \
            --title "release-latest" \
            --notes "Latest build for ${{ github.ref_name }}" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}