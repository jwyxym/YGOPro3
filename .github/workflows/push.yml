name: push YGOPro3

on:
  push:
    tags:
      - 'push.[0-9]+.[0-9]+.[0-9]+'
    
concurrency:
  group: push-ygopro3-bucket
  cancel-in-progress: false
  queue: max

jobs:
  push-to-bucket:
    name: Push ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        artifact:
          - YGOPro3-arm64-v8a.apk
          - YGOPro3-armeabi-v7a.apk
          - YGOPro3-x86.apk
          - YGOPro3-x86_64.apk
          - YGOPro3-windows-x86_64.exe
          - YGOPro3-windows-x86_64.msi
          - YGOPro3-windows-aarch64.exe
          - YGOPro3-windows-aarch64.msi
          - YGOPro3-macos-x86_64.dmg
          - YGOPro3-macos-x86_64.app.zip
          - YGOPro3-macos-aarch64.dmg
          - YGOPro3-macos-aarch64.app.zip
          - YGOPro3-linux-x86_64.deb
          - YGOPro3-linux-aarch64.deb
          - YGOPro3-linux-x86_64.rpm
          - YGOPro3-linux-aarch64.rpm
          - YGOPro3-linux-x86_64.AppImage
          - YGOPro3-linux-aarch64.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Download ${{ matrix.artifact }}
        uses: robinraju/release-downloader@v1.10
        with:
          tag: release-latest
          fileName: ${{ matrix.artifact }}
          out-file-path: "./build/"

      - name: Upload artifact to Bucket (${{ matrix.artifact }})
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: ${{ matrix.artifact }}
          file_path: ./build/${{ matrix.artifact }}

  update-version:
    runs-on: ubuntu-latest
    needs: push-to-bucket
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Write Version
        run: |
          cd .ci
          python write_version.py ${{ github.ref_name }}

      - name: Upload to Bucket
        uses: jwyxym/jwyxym/s3@master
        with:
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: version.txt
          file_path: ./.ci/version.txt

  flush-cdn:
    runs-on: ubuntu-latest
    needs: update-version
    steps:
      - uses: actions/checkout@v4

      - uses: jwyxym/jwyxym/edgeone-cache@master
        with:
          secret_id: ${{ secrets.EDGE_ID }}
          secret_key: ${{ secrets.EDGE_KEY }}
          zone_id: ${{ secrets.EDGE_ZONE_ID }}
          url_target: ${{ secrets.EDGE_URL }}
          flush_type: "purge_prefix"